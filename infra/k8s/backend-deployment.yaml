apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniai-backend
  namespace: omniai
  labels:
    app: omniai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: omniai-backend
  template:
    metadata:
      labels:
        app: omniai-backend
    spec:
      containers:
        - name: backend
          image: omniai-backend:latest # build via backend/Dockerfile, push to your registry
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: omniai-backend-secrets
          env:
            - name: CORS_ORIGINS
              value: '["https://app.example.com"]'
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: omniai-backend
  namespace: omniai
spec:
  selector:
    app: omniai-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
