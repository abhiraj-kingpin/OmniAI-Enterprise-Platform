# Copy to backend-secret.yaml and fill in real values — never commit real
# keys. `kubectl create secret generic omniai-backend-secrets
# --from-literal=ANTHROPIC_API_KEY=... -n omniai` works just as well and
# keeps the key out of any file entirely.
apiVersion: v1
kind: Secret
metadata:
  name: omniai-backend-secrets
  namespace: omniai
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  OPENAI_API_KEY: "sk-..."
  JWT_SECRET: "generate-a-long-random-value"
